paths:
  raw: ../../data/raw
  reference: ../../data/reference
  standardized: ../../data/standardized
  deduplicated: ../../data/deduplicated
  submit_ready: ../../data/submit_ready
  overrides: ../../data/reference/overrides.csv
  routing: ../../data/reference/cp_routing.csv
  upload_format: ../../data/reference/format_unggah_siswa_2026.xlsx
  school_source: ../../data/reference/schools_kemendikdasmen.csv
  school_source_state: ../../data/reference/schools_kemendikdasmen.done
  school_master: ../../data/reference/school_master.csv
  assigned_keys: ../../data/reference/assigned_keys.csv

null_value: "-"

columns:
  - "No"
  - Nama Lengkap
  - NISN
  - Email
  - Kategori
  - Gender
  - Kelas
  - Jenjang Sekolah
  - Nama Sekolah
  - Kota/Kabupaten
  - Nama Pendamping
  - No Kontak Pendamping
  - Status Pendamping
  - Bahasa
  - Sesi
  - Nama Biro

# normalized header (lowercase, single spaces, no dots) -> canonical column
header_aliases:
  gategori: Kategori
  kot/kabupaten: Kota/Kabupaten
  jenjang: Jenjang Sekolah
  kelas: Kelas
  sekolah: Nama Sekolah
  pendamping: Nama Pendamping

# canonical value -> accepted spellings (lowercase)
value_maps:
  Gender:
    Laki-laki: [l, lk, laki-laki, laki laki, laki - laki, pria]
    Perempuan: [p, pr, perempuan, wanita]
  Kategori:
    SiKecil: [sikecil, si kecil, sikecil kelas]
    Siaga: [siaga]
    Penggalang: [penggalang]
    Penegak: [penegak]
  Jenjang Sekolah:
    Preschool: [preschool, paud, tk]
    SD: [sd, sekolah dasar, sekolah dasar(sd)]
    MTI: [mti, mi, madrasah ibtidaiyah]  # the site's list is Preschool/SD/MTI/SMP/MTs/SMA/MA/SMK/MAK, it rejects MI
    SMP: [smp]
    MTs: [mts]
    SMA: [sma]
    MA: [ma]
    SMK: [smk]
    MAK: [mak]
  Status Pendamping:
    Guru: [guru, guru informatika]
    Orang Tua: [orang tua, orangtua, ortu]
    Wali: [wali]
  Bahasa:
    Indonesia: [indonesia, b. indonesia, bahasa indonesia]
    Inggris: [inggris, english, bahasa inggris]
  Nama Biro:
    Universitas Telkom: [universitas telkom, telkom university, universitas telkom bandung, univesity telkom, telkom univ, tel-u]

# value written when the sender left the column empty
defaults:
  Nama Biro: Universitas Telkom

kelas_range: [0, 12]

# Kelas -> Kategori
kategori_by_kelas:
  SiKecil: [0, 3]
  Siaga: [4, 6]
  Penggalang: [7, 9]
  Penegak: [10, 12]

sesi_valid: [A, B, C, D, E, F, G, H, I, A1, B1, C1, D1, E1, F1, G1, H1, I1]
# session letters each category can take (Friday has no E; letters with 1 are Wednesday, Penggalang only)
sesi_by_kategori:
  SiKecil: [A, B, C, D, F, G, H, I]
  Siaga: [A, B, C, D, E, F, G, H, I]
  Penggalang: [A, B, C, D, E, F, G, H, I, A1, B1, C1, D1, E1, F1, G1, H1, I1]
  Penegak: [A, B, C, D, E, F, G, H, I]

nisn_length: 10

# the two invented students that ship with the template (lowercase)
template_example_names: [ananda hening, andika perdana]

# a file is rejected when one of these is missing; one column of each group is enough
required_columns: [Nama Lengkap, NISN, Nama Sekolah]
required_any:
  - [Kategori, Kelas]

# a file with a larger share of rows in error is flagged for a manual look
flag_error_share: 0.30

# input of the partition stage: the standardized files, or the deduplicated ones once that stage exists
partition_input: deduplicated

# the bureau code of the site's bureau page; a student without a NISN gets <bureau_code>_NNNNN
bureau_code: telkomuniversity

# intake from the submission form's response sheet; the sheet link is given on the command line, not stored here
intake:
  columns:
    timestamp: Timestamp
    sender_name: Nama Pembina
    sender_role: Status Pembina
    sender_phone: Nomor WA Pembina
    school: Nama Sekolah
    file_link: Upload Formulir Pendaftaran
  role_map:
    guru: teacher
    orangtua: parent
    orang tua: parent
    wali: guardian
    tenaga kependidikan: school_staff
  target_dir: ../../data/raw/gform
  state_file: ../../data/raw/gform/intake_state.csv

# the public reference pages of the ministry (Pusdatin Kemendikdasmen); codes of the regions and of the school forms in the page addresses
school_source:
  base: https://referensi.data.kemendikdasmen.go.id/pendidikan
  delay_seconds: 0.3
  regions: {Kota Bandung: "026000", Kabupaten Bandung: "020800", Kabupaten Bandung Barat: "022300", Kota Cimahi: "026700"}
  forms:
    dikdas: {SD: 5, SMP: 6, MI: 9, MTs: 10}
    dikmen: {SMA: 13, SMK: 15, MA: 16, MAK: 17}
