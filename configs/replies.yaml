# Draft reply messages (Indonesian) for the problems the review report can raise.
# Placeholders: {rows} row numbers as the sender sees them in Excel, {column} the column, {columns} missing columns.
greeting: "Yth. Bapak/Ibu, terima kasih telah mengirimkan file pendaftaran Bebras Indonesia Challenge 2026{school}. Setelah kami periksa, ada hal yang perlu diperbaiki:"
rejected_greeting: "Yth. Bapak/Ibu, terima kasih telah mengirimkan file pendaftaran Bebras Indonesia Challenge 2026{school}. File ini belum dapat kami proses karena:"
closing: "Mohon kirim ulang file yang sudah diperbaiki. Terima kasih."

codes:
  reject_unreadable: "File tidak dapat dibuka. Mohon simpan ulang dalam format Excel (.xlsx) tanpa kata sandi."
  reject_no_table: "Tabel siswa tidak ditemukan. Mohon gunakan templat Excel terbaru, isi data di bawah judul kolom, dan jangan mengubah judul kolom (kolom Nama Lengkap harus ada)."
  reject_no_rows: "Tidak ada data siswa di dalam file. Mohon isi data siswa pada templat."
  reject_missing_column: "Kolom berikut tidak ada pada file: {columns}. Mohon gunakan templat terbaru dan jangan mengubah atau menghapus judul kolom."
  reject_old_template: "File menggunakan templat tahun sebelumnya (tanpa kolom NISN). Mohon unduh templat 2026 di https://bit.ly/TantanganBebras2026 dan pindahkan datanya ke templat tersebut."
  missing_name: "Nama lengkap siswa belum diisi, {rows}."
  missing_school: "Nama sekolah belum diisi, {rows}."
  missing_nisn: "NISN belum diisi, {rows}. Isi dengan 10 digit angka. Jika siswa belum memiliki NISN, mohon hubungi kami."
  nisn_format: "NISN harus 10 digit angka dan diformat sebagai teks agar angka 0 di depan tidak hilang, {rows}."
  unknown_value: "Isian pada kolom {column} tidak sesuai pilihan yang tersedia, {rows}."
  kelas_invalid: "Kelas belum diisi atau bukan angka 0 sampai 12, {rows}."
  kategori_mismatch: "Kategori tidak sesuai dengan kelas, {rows} (SiKecil kelas 1-3, Siaga kelas 4-6, Penggalang kelas 7-9, Penegak kelas 10-12)."
  sesi_invalid: "Sesi harus berupa huruf A sampai I (atau A1 sampai I1 untuk hari Rabu), {rows}."
  sesi_category: "Sesi tidak tersedia untuk kategorinya, {rows} (sesi E tidak tersedia untuk SiKecil; sesi A1 sampai I1 hanya untuk Penggalang)."
  duplicate_nisn: "NISN sama dengan siswa lain, {rows}. Setiap siswa harus memiliki NISN yang berbeda."
